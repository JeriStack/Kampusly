                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a single owned notification as read
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Notification marked read }
        '403': { description: Notification belongs to another user }

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all of the current user's unread notifications as read
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': { description: All notifications marked read }

  /health/live:
    get:
      tags: [System]
      summary: Liveness probe (no sensitive diagnostics)
      responses:
        '200':
          description: Application process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /health/ready:
    get:
      tags: [System]
      summary: Readiness probe verifying MySQL connectivity
      responses:
        '200':
          description: Database connection healthy
        '503':
          description: Database unreachable

# Reverse-proxies /api to PHP-FPM and serves the single PHP entry point.
# The document root points at backend/public/index.php; nothing outside
# public/ is reachable from the web.

server {
    listen 80;
    server_name localhost;

    root /var/www/backend/public;
    index index.php;

    # Explicitly disable directory listing across all locations
    autoindex off;

    # Request size and timeout limits
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    include /etc/nginx/snippets/security-headers.conf;

    # Normalize exact /api and /api/v1 requests into the front controller
    location = /api {
        try_files $uri /index.php$is_args$args;
    }

    # All /api/* traffic is handled by the single PHP front controller
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # Execute only the single approved front controller via PHP-FPM
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_ID $request_id;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files (.env, .git, .htaccess, etc.) except .well-known
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to sensitive config, dependency, and schema files
    location ~* (?:\.(?:env|ini|log|sh|sql|yaml|yml|neon|lock|bak|dump)|composer\.(?:json|lock)|phpunit\.xml|phpcs\.xml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct execution of any other .php file in public/
    location ~ \.php$ {
        return 404;
    }
}

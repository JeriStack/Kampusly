# ---------------------------------------------------------------------------
# Kampusly — local development stack
# Services are limited to what the current stage uses: nginx, php-fpm, mysql,
# frontend, and mailpit. Scheduler/worker, Prometheus, Grafana, a WebSocket
# process, and Redis are added later only when a release needs them.
# ---------------------------------------------------------------------------

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      - ./backend/public:/var/www/backend/public:ro
    networks:
      - kampusly

  php:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Manila}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-kampusly}
      DB_USERNAME: ${DB_USERNAME:-kampusly_app}
      DB_PASSWORD: ${DB_PASSWORD:-replace_me}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    volumes:
      - ./backend:/var/www/backend
    networks:
      - kampusly

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kampusly}
      MYSQL_USER: ${DB_USERNAME:-kampusly_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-replace_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-replace_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kampusly

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ${APP_URL:-http://localhost:8080}/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - kampusly

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP sink
    networks:
      - kampusly

networks:
  kampusly:
    driver: bridge

volumes:
  mysql-data:

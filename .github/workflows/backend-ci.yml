name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
    paths:
      - 'backend/**'
      - 'docs/phase-2/phase-2-api-contract.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend-quality:
    name: Native PHP 8.3 Quality, Tests & OpenAPI Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, intl, json
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies & generate optimized PSR-4 autoloader
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHP syntax validation
        run: composer lint

      - name: Run PSR-12 coding standard check
        run: composer cs

      - name: Run static analysis
        run: composer stan

      - name: Run unit and feature test suite
        run: composer test

      - name: Verify CLI liveness health probe
        run: composer health

      - name: Validate OpenAPI 3.1 contract specification
        working-directory: ${{ github.workspace }}
        run: |
          test -f docs/phase-2/phase-2-api-contract.yaml
          grep -q '^openapi: 3\.1\.0' docs/phase-2/phase-2-api-contract.yaml
          grep -q '/health/live:' docs/phase-2/phase-2-api-contract.yaml
          grep -q '/health/ready:' docs/phase-2/phase-2-api-contract.yaml
          echo "[OK] OpenAPI 3.1 contract verified."


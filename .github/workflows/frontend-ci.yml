name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - development
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
      - development

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Vue 3 + TypeScript Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Run linter (ESLint / Vue SFC & TS AST checks)
        run: npm run lint

      - name: Run formatting check (Prettier)
        run: npm run format:check

      - name: Run TypeScript type check (vue-tsc)
        run: npm run type-check

      - name: Run unit tests
        run: npm run test

      - name: Build production bundle
        env:
          VITE_APP_NAME: Kampusly
          VITE_API_BASE_URL: /api/v1
        run: npm run build
